apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: 
  name: hospital-route
  namespace: ho-ns
spec:
  parentRefs:
    - name: new-gateway
      namespace: l-ns
  rules:
    - matches: 
        - path:
            type: PathPrefix
            value: /hospital
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              value: /
      backendRefs:
        - name: hospital-service
          port: 80

