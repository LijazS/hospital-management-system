name: Reusable Dependency Scan

on:
  workflow_call:
    outputs:
      snyk_status:
        description: "Snyk outcome"
        value: ${{ jobs.snyk-scan.outputs.snyk_status }}

jobs:
  snyk-scan:
    runs-on: ubuntu-latest
    outputs:
      snyk_status: ${{ steps.snyk-check.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        id: snyk-check
        uses: snyk/actions/node@master
        with:
          args: --file=backend/package.json --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Show Snyk outcome
        run: echo "Snyk outcome- ${{ steps.snyk-check.outcome }}"