name: Hospital image build & scan Flow

on:
  push:
    branches:
      - deploying

concurrency:
  group: hospital-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar-scan:
    uses: ./.github/workflows/sonar-scan.yaml
    secrets: inherit

  sonar-scan-notification:
    needs:
    - sonar-scan
    if: ${{ needs.sonar-scan.outputs.quality_gate_status == 'FAILED' }}
    uses: ./.github/workflows/code-quality-notification.yaml
    with:
      quality_gate_status: ${{ needs.sonar-scan.quality_gate_status }}
    secrets: inherit


  dependency-scan:
    uses: ./.github/workflows/snyk-scan.yaml
    secrets: inherit

  dependency-notification:
  needs:
  - dependency-scan
  if: ${{ needs.dependency-scan.snyk_status == 'failure' }}
  with:
    snyk_status: ${{ needs.dependency-scan.snyk_status }}


  image-build-scan:
    if: ${{ needs.sonar-scan.outputs.quality_gate_status == 'PASSED' && needs.dependency-scan.outputs.snyk_status == 'success' }}
    needs:
      - sonar-scan
      - dependency-scan
    uses: ./.github/workflows/docker-scan.yaml
    secrets: inherit