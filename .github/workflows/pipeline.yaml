name: Hospital image build & scan Flow

on:
  push:
    branches:
    - 'deploying'

jobs:
  build-scan:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    ######## SONARQUBE CHECKING, QG check, SAVING TO ARTIFACTS #########

    - name: Scan using Sonar Cube
      uses: SonarSource/sonarqube-scan-action@v7.1.0
      with:
        args: >
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    - name: Check SonarQube Quality Gate
      id: sonarqube-quality-gate-check
      uses: SonarSource/sonarqube-quality-gate-action@master
      with:
        pollingTimeoutSec: 300
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


    - name: Generate SonarQube issues JSON
      if: always()
      run: |
          python3 - <<'PY'
          import json

          with open("reports/sonarqube-issues.json") as f:
              data = json.load(f)

          issues = data.get("issues", [])

          with open("reports/sonarqube-issues.txt", "w") as out:
              out.write("SONARQUBE ISSUES REPORT\n")
              out.write("="*40 + "\n\n")
              out.write(f"Total Issues: {len(issues)}\n\n")

              for i, issue in enumerate(issues, 1):
                  out.write(f"{i}. [{issue.get('severity')}] {issue.get('message')}\n")
                  out.write(f"   File: {issue.get('component')}\n")
                  out.write(f"   Line: {issue.get('line')}\n")
                  out.write(f"   Rule: {issue.get('rule')}\n")
                  out.write("-"*40 + "\n")
          PY


    - name: Upload SonarQube report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sonarqube-report
        path: reports/sonarqube-issues.txt


  ####################################################################

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      with:
        args: --file=backend/package.json
              --severity-threshold=high
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      continue-on-error: true

    - name: Build the image
      run: |
        docker build -t hospital-app:v1.0.0 .

    - name: Scan the image
      uses: aquasecurity/trivy-action@v0.20.0
      with:
        image-ref: hospital-app:v1.0.0
        format: table
        exit-code: 0
        severity: HIGH,CRITICAL

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_NAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Tag image for Docker Hub
      run: |
        docker tag hospital-app:v1.0.0 \
        ${{ secrets.DOCKER_NAME }}/hospital-app:v1.0.0

    - name: push to Docker Hub
      run: docker push ${{ secrets.DOCKER_NAME }}/hospital-app:v1.0.0