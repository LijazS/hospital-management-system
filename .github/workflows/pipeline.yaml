name: Hospital image build & scan Flow

on:
  push:
    branches:
      - deploying

concurrency:
  group: hospital-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar-scan:
    uses: ./.github/workflows/sonar-scan.yaml
    secrets: inherit

  dependency-scan:
    uses: ./.github/workflows/snyk-scan.yaml
    secrets: inherit

  image-build-scan:
    needs:
      - sonar-scan
      - dependency-scan
    uses: ./.github/workflows/docker-scan.yaml
    secrets: inherit