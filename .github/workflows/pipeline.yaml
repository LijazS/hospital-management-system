name: Hospital image build & scan Flow

on:
  push:
    branches:
    - 'deploying'

jobs:
  build-scan:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    ######## SONARQUBE CHECKING, QG check, SAVING TO ARTIFACTS, sending mail #########

    - name: Scan using Sonar Cube     # Scans the code and stores reports in server. can retrieve using /api/issues endpoint
      uses: SonarSource/sonarqube-scan-action@v7.1.0
      with:
        args: >
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    - name: Check SonarQube Quality Gate    # Returns PASSED or FAILED as output.quality-gate-status
      id: sonarqube-quality-gate-check
      uses: SonarSource/sonarqube-quality-gate-action@master
      with:
        pollingTimeoutSec: 300
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      continue-on-error: true

    #### The section below only runs if QG fails

    - name: Generate SonarQube issues JSON
      if: steps.sonarqube-quality-gate-check.outputs.quality-gate-status == 'FAILED'
      run: |
        mkdir -p reports
        curl -s \
          -H "Authorization: Bearer ${SONAR_TOKEN}" \
          "${SONAR_HOST_URL}/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&resolved=false&ps=500" \
          -o reports/sonarqube-issues.json
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}


    - name: Generate readable HTML report
      if: steps.sonarqube-quality-gate-check.outputs.quality-gate-status == 'FAILED'
      run: |
        python3 - <<'PY'
        import json

        with open("reports/sonarqube-issues.json") as f:
            data = json.load(f)

        issues = data.get("issues", [])

        with open("reports/sonarqube-report.html", "w") as out:
            out.write("<h2>SonarQube Issues Report</h2>")
            out.write(f"<p>Total Issues: {len(issues)}</p>")
            out.write("<ul>")

            for issue in issues:
                out.write("<li>")
                out.write(f"<b>{issue.get('severity')}</b>: {issue.get('message')}<br>")
                out.write(f"File: {issue.get('component')}<br>")
                out.write(f"Line: {issue.get('line')}<br>")
                out.write(f"Rule: {issue.get('rule')}")
                out.write("</li><br>")

            out.write("</ul>")
        PY



    - name: Upload SonarQube report artifact
      if: steps.sonarqube-quality-gate-check.outputs.quality-gate-status == 'FAILED'
      uses: actions/upload-artifact@v4
      with:
        name: sonarqube-report
        path: reports/sonarqube-report.html



    - name: Send email with report
      uses: hilarion5/send-mail@v1
      with:
        smtp-server: smtp.gmail.com
        smtp-port: 587
        smtp-secure: true
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        from-email: ${{ secrets.MAIL_FROM }}
        to-email: ${{ secrets.MAIL_TO }}
        subject: "SonarQube Report"
        html: |
          <h3>SonarQube Report Attached</h3>
          <p>Check the attachment</p>
        attachments: reports/sonarqube-report.html

    - name: Fail pipeline at the end if Quality Gate failed     # Stops the pipeline if QG failed
      if: steps.sonarqube-quality-gate-check.outputs.quality-gate-status == 'FAILED'
      run: |
        echo "SonarQube Quality Gate failed"
        exit 1


  ####################################################################

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/node@master
      with:
        args: --file=backend/package.json
              --severity-threshold=high
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      continue-on-error: true

    - name: Build the image
      run: |
        docker build -t hospital-app:v1.0.0 .

    - name: Scan the image
      uses: aquasecurity/trivy-action@v0.20.0
      with:
        image-ref: hospital-app:v1.0.0
        format: table
        exit-code: 0
        severity: HIGH,CRITICAL

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_NAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Tag image for Docker Hub
      run: |
        docker tag hospital-app:v1.0.0 \
        ${{ secrets.DOCKER_NAME }}/hospital-app:v1.0.0

    - name: push to Docker Hub
      run: docker push ${{ secrets.DOCKER_NAME }}/hospital-app:v1.0.0