name: Hospital image build & scan Flow

on:
  push:
    branches:
      - deploying

concurrency:
  group: hospital-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar-scan:
    uses: ./.github/workflows/sonar-scan.yaml
    secrets: inherit

  dependency-scan:
    uses: ./.github/workflows/snyk-scan.yaml
    secrets: inherit


  image-build-scan:
    if: needs.code-quality.outputs.quality_gate_status ==  'PASSED' && needs.dependency-scan.outputs.snyk_status == 'success'
    needs:
      - sonar-scan
      - dependency-scan
    uses: ./.github/workflows/docker-scan.yaml
    secrets: inherit