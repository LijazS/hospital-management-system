name: Snyk send notification

on:
  workflow_call:
    inputs:
      snyk_status:
        required: true
        type: string

jobs:
  snyk-notification:
    runs-on: ubuntu-latest

    steps:
      - name: Create Snyk HTML report
        if: ${{ inputs.snyk_status == 'failure' }}
        run: |
          mkdir -p reports
          cat > reports/snyk-report.html <<'EOF'
          <html>
            <head>
              <title>Snyk Scan Report</title>
            </head>
            <body>
              <h2>Snyk Security Scan Failed</h2>
              <p>The Snyk dependency scan reported blocking vulnerabilities or policy issues.</p>
              <p><strong>Repository:</strong> ${{ github.repository }}</p>
              <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
              <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
              <p>
                <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                  View workflow run
                </a>
              </p>
            </body>
          </html>
          EOF

      - name: Upload Snyk report artifact
        if: ${{ inputs.snyk_status == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: reports/snyk-report.html

      - name: Send email with report
        if: ${{ inputs.snyk_status == 'failure' }}
        uses: hilarion5/send-mail@v1
        with:
          smtp-server: smtp.hostinger.com
          smtp-port: 587
          smtp-secure: false
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from-email: ${{ secrets.MAIL_FROM }}
          to-email: ${{ secrets.MAIL_TO }}
          subject: "Snyk Scan Report"
          html: |
            <h3>Snyk Scan Report</h3>
            <p>The Snyk dependency scan failed.</p>
            <p>Download the report from the workflow:</p>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              View Report
            </a>

      - name: Post to Slack
        if: ${{ inputs.snyk_status == 'failure' }}
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.SLACK_INCOMING_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "Snyk report is ready"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "*Triggered by:* `${{ github.actor }}`"
              - type: section
                text:
                  type: mrkdwn
                  text: "*SNYK ALERT:* Dependency scan failed."
              - type: section
                text:
                  type: mrkdwn
                  text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Report>"