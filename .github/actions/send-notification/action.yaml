name: Send Notification
description: Send email and Slack notification

inputs:
  pipeline_name:
    required: true
  repository_name:
    required: true
  failure_reason:
    required: true
  author:
    required: true
  smtp_username:
    required: true
  smtp_password:
    required: true
  mail_from:
    required: true
  mail_to:
    required: true
  slack_webhook:
    required: true

runs:
  using: composite
  steps:
    - name: Send email
      uses: hilarion5/send-mail@v1
      with:
        smtp-server: smtp.hostinger.com
        smtp-port: 587
        smtp-secure: false
        username: ${{ inputs.smtp_username }}
        password: ${{ inputs.smtp_password }}
        from-email: ${{ inputs.mail_from }}
        to-email: ${{ inputs.mail_to }}
        subject: "${{ inputs.pipeline_name }} - ${{ inputs.repository_name }} FAILED"
        html: |
          <h3>${{ inputs.pipeline_name }} - ${{ inputs.repository_name }}</h3>
          <p><strong>REASON:</strong> ${{ inputs.failure_reason }}</p>
          <p><strong>Author:</strong> ${{ inputs.author }}</p>
          <p>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
              View workflow run
            </a>
          </p>

    - name: Post to Slack
      uses: slackapi/slack-github-action@v3.0.1
      with:
        webhook: ${{ inputs.slack_webhook }}
        webhook-type: incoming-webhook
        payload: |
          text: "${{ inputs.pipeline_name }} - ${{ inputs.repository_name }} FAILED"
          blocks:
            - type: section
              text:
                type: mrkdwn
                text: "*${{ inputs.pipeline_name }} - ${{ inputs.repository_name }}*"
            - type: section
              text:
                type: mrkdwn
                text: "*REASON:* ${{ inputs.failure_reason }}"
            - type: section
              text:
                type: mrkdwn
                text: "*Author:* ${{ inputs.author }}"
            - type: section
              text:
                type: mrkdwn
                text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"